# 视频/封面反代示例（大陆 VPS + nginx）

> 适用于 AstrBot 服务器无法直连 B 站 CDN 的情况。nginx 会把请求转发到 B 站，
> 再把响应流式返回给 AstrBot。只允许 B 站相关域名，避免变成开放代理。

在 `nginx.conf` 的 `server {}` 中加入：

```nginx
# 只允许转发到 B 站相关域名
map $arg_url $bili_proxy_allowed {
    default 0;
    "~*^https?://[^/]*\.bilivideo\.com/" 1;
    "~*^https?://[^/]*\.hdslb\.com/"     1;
    "~*^https?://[^/]*\.akamaized\.net/" 1;
    "~*^https?://([^/]*\.)?bilibili\.com/" 1;
}

location /bili-proxy {
    if ($bili_proxy_allowed = 0) {
        return 403;
    }

    set $upstream $arg_url;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Referer "https://www.bilibili.com/";
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_pass_request_body off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # 大文件流式返回
    proxy_max_temp_file_size 0;
    chunked_transfer_encoding on;
}
```

部署后：

- 视频代理：`video_proxy: https://你的域名/bili-proxy?url={url}`
- 封面代理：`cover_proxy: https://你的域名/bili-proxy?url={url}`

## 方案二：HTTP 代理（更简单）

如果 VPS 上跑的是 3proxy / Squid / mihomo 这类 HTTP 代理，直接在插件配置里填：

```
proxy: http://user:password@你的VPS:端口
```

插件会让 **playurl 请求和视频下载走同一个代理**，签名 IP 一致，B 站 CDN 就不会只返回初始化分片。

## 方案三：Cloudflare Worker

见 `cloudflare-worker/worker.js`。优点是免费、部署快；缺点是其出口 IP 通常在海外，B 站 CDN 可能同样只返回初始化分片，视地区而定。
